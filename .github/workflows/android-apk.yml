name: Android APK

# Two jobs. `build` runs on every branch with no secrets: JVM tests, a debug
# APK signed with the runner's throwaway key (it can never install over the
# owner's app), and a guard that no keystore is tracked. `release` runs on
# master only, in the "release" environment whose branch rule admits only
# master: it signs with the release key, checks the certificate fingerprint,
# publishes the rolling "companion-apk" release and, if configured, sends the
# APK to the owner on Telegram.

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The wrapper JAR is deliberately not committed (binary blob), so CI
      # installs the pinned Gradle itself instead of using ./gradlew.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: No keystore is tracked
        run: |
          if git ls-files android | grep -qi keystore; then
            echo '::error::a keystore is tracked'
            exit 1
          fi

      - name: JVM tests and debug APK
        working-directory: android
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: miya-companion-ci-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release:
    needs: build
    if: github.ref_name == 'master'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      HAS_TG: ${{ secrets.TELEGRAM_BOT_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo '::error::ANDROID_KEYSTORE_BASE64 is not set in the release environment'
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/miya-release.jks"
          echo "MIYA_KEYSTORE_PATH=$RUNNER_TEMP/miya-release.jks" >> "$GITHUB_ENV"

      - name: Release APK
        working-directory: android
        env:
          MIYA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MIYA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MIYA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MIYA_VERSION_CODE: ${{ github.run_number }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify the signing certificate
        env:
          EXPECTED: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          if [ -z "$EXPECTED" ]; then
            echo '::error::ANDROID_CERT_SHA256 is not set in the release environment'
            exit 1
          fi
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          apk=android/app/build/outputs/apk/release/app-release.apk
          "$apksigner" verify --print-certs "$apk" | tee certs.txt
          if ! grep -qi "SHA-256 digest: $EXPECTED" certs.txt; then
            echo '::error::the APK is not signed with the release certificate'
            exit 1
          fi
          cp "$apk" miya-companion.apk

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/miya-release.jks"

      # A rolling release: the same tag is reused and the asset replaced, so
      # the download link never changes:
      #   https://github.com/<owner>/<repo>/releases/download/companion-apk/miya-companion.apk
      - name: Publish to the rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: companion-apk
          name: MIYA Companion (oxirgi APK)
          body: |
            Telefonda shu faylni yuklab olib o'rnating: miya-companion.apk. Yangi kalitga birinchi marta o'tishda eski ilovani o'chirib, keyin o'rnating (docs/ornatish.md, «Telefon ilovasi»).
          files: miya-companion.apk
          prerelease: false

      # Silent, so a merge at night never rings the owner's phone.
      - name: Send to Telegram
        if: env.HAS_TG == 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_OWNER_ID }}
          CAPTION: "📱 MIYA Companion — yangi versiya (#${{ github.run_number }}). O'rnatishdan oldin ilovadagi «Navbat» bo'sh ekanini tekshir. (Tungi soatlarda ovozsiz yuboriladi.)"
        run: |
          curl -fsS -o /dev/null \
            -F chat_id="$TG_CHAT" \
            -F document=@miya-companion.apk \
            -F caption="$CAPTION" \
            -F disable_notification=true \
            "https://api.telegram.org/bot$TG_TOKEN/sendDocument"
