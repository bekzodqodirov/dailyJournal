name: miya

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-miya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-miya}
      TZ: ${TIMEZONE:-Asia/Tashkent}
    volumes:
      - db_data:/var/lib/postgresql/data
    # Localhost only — Postgres is never reachable from outside the VPS.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-miya} -d ${POSTGRES_DB:-miya}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/data
      - ./secrets:/app/secrets:ro
    # Localhost only — the API is not exposed publicly (spec §10).
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  bot:
    build: .
    restart: on-failure:5
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/data
      - ./secrets:/app/secrets:ro
    command: ["python", "-m", "miya.bot.main"]

  worker:
    build: .
    restart: on-failure:5
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/data
      - ./secrets:/app/secrets:ro
    command: ["python", "-m", "miya.worker.main"]

  syncthing:
    image: syncthing/syncthing:1
    restart: unless-stopped
    hostname: miya-vps
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TIMEZONE:-Asia/Tashkent}
    volumes:
      - syncthing_config:/var/syncthing/config
      - ./data/call_recordings:/var/syncthing/call_recordings
    ports:
      # Web UI: localhost only — reach it over an SSH tunnel.
      - "127.0.0.1:8384:8384"
      # Sync protocol + discovery: must be public for the phone to connect.
      # Device-authenticated; see README "Syncthing" for the pairing steps.
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"

volumes:
  db_data:
  syncthing_config:
