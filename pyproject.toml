[project]
name = "miya"
version = "0.1.0"
description = "MIYA — personal AI second brain"
requires-python = ">=3.12"

[tool.ruff]
line-length = 90
target-version = "py312"
extend-exclude = [".venv", "venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",  # FastAPI's Depends() in argument defaults
    # This codebase is deliberately multilingual: Cyrillic in the extraction
    # prompt, Uzbek apostrophes, en dashes in prose. The ambiguous-unicode
    # rules flag all of it as a typo.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:miya.*"]
