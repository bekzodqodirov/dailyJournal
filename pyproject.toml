[project]
name = "miya"
version = "0.1.0"
description = "MIYA — personal AI second brain"
requires-python = ">=3.12"

[tool.ruff]
line-length = 90
target-version = "py312"
extend-exclude = [".venv", "venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",  # FastAPI's Depends() in argument defaults
    # This codebase is deliberately multilingual: Cyrillic in the extraction
    # prompt, Uzbek apostrophes, en dashes in prose. The ambiguous-unicode
    # rules flag all of it as a typo.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.mypy]
# The strict gate for the Jarvis code (JV-02, `make typecheck`): miya/jarvis
# and the shared helpers it is built on. Each new helper module joins `files`
# in the work package that adds it. Imported modules outside the list are
# analysed for their types but their own errors are not reported.
python_version = "3.12"
strict = true
follow_imports = "silent"
warn_unreachable = true
files = [
    "miya/jarvis",
    "miya/logs.py",
    "miya/services/authorship.py",
    "miya/services/receipts.py",
    "miya/services/retry.py",
    "miya/services/safety.py",
    "miya/services/sheets.py",
    "miya/services/sheets_sync.py",
    "miya/services/when.py",
    "miya/userbot/sender.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:miya.*"]
markers = ["slow: seeds large data; runs only with MIYA_RUN_SLOW=1"]
